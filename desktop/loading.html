<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chat2Tasks</title>
    <style>
      body {
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #454545;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
        background: #fafafa;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      .spinner {
        width: 26px;
        height: 26px;
        margin: 0 auto 20px;
        border: 3px solid #e2e9e3;
        border-top-color: #286b43;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      strong {
        display: block;
        color: #222;
        font-size: 20px;
        margin-bottom: 12px;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <strong>Chat2Tasks</strong>
      <p id="status" role="status" aria-live="polite">Starting your workspace…</p>
      <p id="detail">This can take a few seconds.</p>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('status').textContent = 'Chat2Tasks could not start.';
        document.getElementById('detail').textContent =
          'Quit Chat2Tasks from the menu bar, then open it again.';
        document.querySelector('.spinner').hidden = true;
      } else {
        window.chat2tasksDesktop?.onStartupProgress((message) => {
          document.getElementById('status').textContent = message;
        });
      }
    </script>
  </body>
</html>
